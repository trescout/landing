  <!-- Single dome (simplified for small sizes) -->
  <path d="M 30 56 A 20 20 0 0 1 70 56" fill="none" stroke="#5FA8D3" stroke-width="3.5" stroke-linecap="round"/>

  <!-- T crossbar (slightly thicker for clarity at small sizes) -->
