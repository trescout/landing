name: Sözlük oto-büyüme

# Yeni rapor landing'e düştüğünde (reports/**) sözlüğü büyüt + günlük cron yedeği + manuel.
# Gerekli secret: GEMINI_API_KEY (repo Settings → Secrets → Actions).
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
  schedule:
    - cron: '30 5 * * *'   # her gün 05:30 UTC · app raporu (~04:00) + publish sonrası yedek
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dict-sync
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PDF yedeği için (rapor JSON'unda glossary yoksa pdftotext ile okunur)
      - name: poppler-utils kur
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Sözlüğü büyüt (yeni rapor terimleri)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/dict-sync.py

      - name: CSP guard
        run: python3 scripts/check-no-inline-csp.py

      - name: Değişiklik varsa commit'le
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TreScout Bot"
            git config user.email "hello@trescout.com"
            git add -A
            git commit -m "chore(dict-sync): sözlüğe yeni rapor terimleri eklendi [skip ci]"
            git push
            echo "Yeni terim(ler) eklendi ve push edildi."
          else
            echo "Eklenecek yeni terim yok · sözlük güncel."
          fi
