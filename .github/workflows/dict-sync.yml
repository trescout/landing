name: İçerik oto-büyüme (sözlük + keşif)

# Yeni rapor landing'e düştüğünde (reports/**): sözlüğe yeni terimler + keşfe yeni repolar (lite) eklenir.
# Günlük cron yedeği + manuel. Gerekli secret: GEMINI_API_KEY (repo Settings → Secrets → Actions).
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
  schedule:
    - cron: '30 5 * * *'   # her gün 05:30 UTC · app raporu (~04:00) + publish sonrası yedek
  workflow_dispatch:
    inputs:
      reprocess_slugs:
        description: "Keşif reprocess · virgülle slug listesi (catalog'a elle cmds eklenince sayfayı yeniden render eder). Boş = sadece normal büyüme."
        required: false
        default: ''
      headlines_limit:
        description: "Başlık backfill · başlığı olmayan KAÇ girdiye editöryel H1 üretilsin (0 = atla). Batch için ör. 40."
        required: false
        default: '0'

permissions:
  contents: write
  issues: write        # ikiz-tara.py bulgu olunca issue açıyor

concurrency:
  group: dict-sync
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PDF yedeği için pdftotext + keşif lite kartları için Pillow
      - name: Bağımlılıklar
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
          pip install Pillow

      - name: Sözlüğü büyüt (yeni rapor terimleri)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/dict-sync.py

      - name: Sözlük kartlarını üret (yeni terimler · marka OG)
        run: python3 scripts/dict-cards.py

      - name: Keşfi büyüt (yeni rapor repoları · zengin/lite)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover-sync.py

      # Elle tetiklenirse · catalog'a eklenen cmds'leri sayfaya render et + komutsuz flag'i temizle.
      # Slug listesi env üzerinden geçer (komut enjeksiyonu önlemek için inline interpolasyon yok).
      - name: Keşif reprocess (elle · cmds render)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reprocess_slugs != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SLUGS: ${{ github.event.inputs.reprocess_slugs }}
        run: python3 scripts/discover-sync.py --reprocess="$SLUGS"

      # Editöryel başlık backfill · başlığı olmayan girdilere detay-sayfası H1 üretir
      # (liste kartları repo adında kalır). Limit env üzerinden · enjeksiyon yok.
      - name: Keşif başlık backfill (elle · editöryel H1)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.headlines_limit != '' && github.event.inputs.headlines_limit != '0' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.headlines_limit }}
        run: python3 scripts/discover-sync.py --headlines --limit="$LIMIT"

      - name: Çapraz-linkleri yenile (keşif ↔ sözlük)
        run: python3 scripts/cross-link.py

      # İngilizce sayfalar Türkçesinden üretilir · içerik bloklarını çevirip aynı
      # şablona basar (kod olduğu gibi kalır). Çeviriler önbellekli: değişmeyen
      # sayfa bedava, yalnız yeni girdiler çeviri harcar. Bu adım olmadan
      # İngilizce taraf her gün biraz daha geride kalıyordu (2026-08-06: keşif
      # 100 kelime / Türkçesi 314, sözlükte 480 sayfa aynı sabit kalıptı).
      # Katalogdaki elle yazılmış alanlar (cmds · trescout_notu · shot) sayfaya
      # Gemini'siz basılır. Önceden tek yol --reprocess'ti (Gemini + anahtar) ·
      # bu yüzden katkıcıların eklediği komutlar sayfaya hiç düşmüyordu.
      - name: Katalog alanlarını sayfaya bas (komut · not · görsel)
        run: python3 scripts/catalog-render.py

      # İngilizce tanıtım/özet metinleri (tagline_en, kisa_en) · yeni girdiler
      # bunlar olmadan İngilizce kartlarda TÜRKÇE görünüyordu. Betik hiçbir iş
      # akışında değildi, elle çalıştırılıyordu (2026-08-07 bulgusu).
      # Önbellekli: değişmeyen metin çeviri harcamaz.
      - name: İngilizce tanıtım metinleri (tagline_en · kisa_en)
        run: node scripts/translate-i18n.js

      # Fransızca · 2026-08-07'de eklendi. Aynı betikler --lang ile çalışıyor,
      # metinler scripts/diller.py'den geliyor. Yeni dil eklemenin tüm adımları
      # diller.py'nin başlığında yazılı.
      # Diller ELLE yazılıyordu · her yeni dilde bu dosyada BEŞ ayrı yerde
      # satır eklemek gerekiyordu ve biri unutulursa o dil hatta sessizce
      # eksik kalıyordu. Artık liste diller.py'den geliyor (--liste).
      - name: Dil listesi
        id: diller
        run: echo "kodlar=$(python3 scripts/diller.py --liste)" >> "$GITHUB_OUTPUT"

      - name: Tanıtım metinleri (tagline_XX · kisa_XX)
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            [ "$d" = "en" ] && continue   # İngilizce çevirisi ayrı adımda
            node scripts/translate-i18n.js --lang=$d
          done

      # Kapak görselleri · metin GÖRSELE gömülü olduğu için dile bağlı. Yeni
      # kayıtların kapağı burada basılıyor; çevirisi geçmemiş kayıt atlanır ve
      # sayfa Türkçe kapağa düşer (yarım çeviriyle görsel basmaktansa).
      - name: Kapak görselleri (tüm diller)
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            python3 scripts/kapak-gorselleri.py --lang=$d
          done

      # SIRA ÖNEMLİ · sözlük ÖNCE. Keşif sayfasındaki "İlgili sözlük terimleri"
      # bölümü, o dilde sözlük sayfası diskte VARSA basılıyor. Ters sırada yeni
      # bir dilin ilk gününde 400+ keşif sayfası çapraz bağlantısız çıkıyor
      # (2026-08-13'te Portekizce'de yaşandı · sonraki günler kendiliğinden
      # düzeliyordu, o yüzden görülmemişti).
      - name: Sayfaları üret · her dilde sözlük SONRA keşif
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            echo "── $d"
            python3 scripts/dictionary-en.py --lang=$d
            python3 scripts/discover-en.py   --lang=$d
          done

      # İKİNCİ TUR · çapraz bağlantı kuralı İKİ YÖNLÜ:
      #   keşif sayfası → "İlgili sözlük terimleri" · sözlük sayfası → "İlgili araçlar"
      # İkisi de karşı sayfanın O DİLDE DİSKTE olmasına bakıyor. Tek turda hangisi
      # önce çalışırsa diğerinin bağlantıları eksik kalıyor · aynı gün eklenen YENİ
      # bir terim yeni bir aracı gösteriyorsa o bölüm çevirilerde hiç basılmıyor
      # (2026-08-15: "svg" terimi beş dilde "İlgili araçlar" olmadan çıktı;
      # Almanca eklenirken de 353 sözlük sayfası aynı sebeple eksikti).
      # Çeviriler önbellekli · ikinci tur birkaç saniye.
      - name: Sözlük ikinci tur (keşif sayfaları artık diskte)
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            python3 scripts/dictionary-en.py --lang=$d
          done

      # Dizin sayfaları · kart ızgarası + arama/sıralama. Detay sayfalarından
      # SONRA çalışmalı: kabuğu (nav/footer) o dilin üretilmiş bir sayfasından
      # kopyalıyor.
      - name: Dil dizin sayfaları (tüm diller)
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            node scripts/build-en.js --lang=$d
          done
          # dil-anasayfa.py ARTIK ÇAĞRILMIYOR · Fransızca ana sayfa Türkçesinin
          # tam çevirisi oldu ve elle bakılıyor (check-sayfa-paritesi.py
          # denetliyor). Betik yeni diller için duruyor, tam sayfayı ezmiyor.
          # Elle yazılan Fransızca sayfalar hiçbir üreticiden geçmiyor · menü
          # değişince kabukları geride kalmasın diye tazeleyici koşuyor.
          for d in ${{ steps.diller.outputs.kodlar }}; do
            [ -f "$d/index.html" ] && python3 scripts/dil-kabuk-tazele.py --lang=$d
          done

      # Rapor arşivi sayfaları · rapor yayını (app · publish-report.ts) PDF ve
      # çevrilmiş JSON'u üretiyor, sayfaları burada basıyoruz. O dilin çevrilmiş
      # JSON'u olmayan tarih atlanır · Türkçe içerikli sayfa çıkmasın diye.
      - name: Rapor arşivi sayfaları (tüm diller)
        run: |
          for d in ${{ steps.diller.outputs.kodlar }}; do
            node scripts/build-reports-en.js --lang=$d
          done

      - name: AI'a hizmet · keşif index server-render + .md + llms.txt
        run: |
          python3 scripts/discover-index.py
          python3 scripts/discover-md.py
          python3 scripts/llms-txt.py

      # Sayfa guard'ları · üretilen sayfalar [skip ci] ile push'landığı için csp-inline-guard.yml
      # Ortak chrome (nav/footer) dört üreticide kopyalanmış durumda · yeni üretilen
      # sayfalar eski menüyle çıkabiliyor. Kanonik hâli tek yer veriyor: bu normalize
      # edici. Üretimden SONRA, guard'lardan ÖNCE çalışır (2026-08-06'da 24 sözlük
      # sayfası eski nav'la üretilip guard'ı düşürdüğü için eklendi).
      # Sitemap'i güncel tutan bir süreç yoktu · İngilizce sayfalar tek seferlik
      # eklenmiş ve güncellenmemişti (2026-08-06'da 154 sayfa dışarıdaydı).
      # Diskteki her sayfayı alır, silinmişleri çıkarır, mevcut lastmod'lara dokunmaz.
      # Birleşmiş terimlerin 301'leri vercel.json'da · birlesmis.json
      # değişirse yönlendirmeler de yenilensin.
      - name: Yönlendirmeleri üret
        run: python3 scripts/redirect-uret.py

      - name: Sitemap senkronu
        run: python3 scripts/sitemap-sync.py

      - name: Chrome normalize (nav + footer kanonik hâle)
        run: node scripts/fix-all-headers-and-footers.js

      # hreflang normalize · ÜRETİMDEN SONRA, GUARD'DAN ÖNCE.
      # 2026-08-13'te guard eklendi ama bu adım eklenmedi · hat o günden beri
      # HER GÜN kırıldı. Guard iş akışının SONUNDA olduğu için commit adımına
      # hiç gelinmedi: üç gün boyunca yeni keşif kaydı, yeni sözlük terimi ve
      # çapraz-link tazelemesi YAYINLANMADI (katalog 2026-08-12'de durdu).
      # Guard'ı normalize edici olmadan eklemek, guard'ı hiç eklememekten kötü.
      - name: hreflang normalize (üretilen sayfalar dahil)
        run: python3 scripts/hreflang-normalize.py

      # bot commit'lerinde çalışmaz; aynı guard'ları burada üretici çıktısına da uyguluyoruz.
      - name: Inline CSS/JS kontrolü
        run: python3 scripts/check-no-inline-csp.py
      - name: Nav tutarlılık kontrolü
        run: python3 scripts/check-nav-consistency.py
      - name: Footer tutarlılık kontrolü
        run: python3 scripts/check-footer-consistency.py
      - name: Logo geometri kontrolü
        run: python3 scripts/check-logo-consistency.py
      - name: Başlık tutarlılık kontrolü (katalog ↔ sayfa H1)
        run: python3 scripts/check-headline-consistency.py
      - name: Marka tipografi kontrolü (🚀 · em dash)
        run: python3 scripts/check-brand-typography.py

      # Aydınlatma/rıza · her kayıt formu SAYFANIN DİLİNDEKİ metne bağlanmalı.
      # 2026-08-06'da İngilizce sayfadan aydınlatma yapılmadan kayıt alındı.
      - name: Aydınlatma ve rıza kontrolü
        run: python3 scripts/check-consent-consistency.py

      - name: Sayfa paritesi (diller arası yapı)
        run: python3 scripts/check-sayfa-paritesi.py

      # PR'da SERT, günlük hatta YUMUŞAK. Sebep: bu bir içerik bütünlüğü
      # ölçüsü ve tek bir sayfanın eksik bölümü için 6500 sayfalık yayını
      # durdurmak orantısız · üstelik bugün tam bunun bedelini ödedik
      # (hreflang guard'ı üç gün hattı kilitledi). Yapısal sapma bir sonraki
      # turda kendiliğinden düzeliyor; loga düşüyor, gözden kaçmıyor.
      # csp-inline-guard.yml'de (insan bakarken) çıkış kodu hâlâ sert.
      - name: Bölüm paritesi (üretilen sayfalar · h2 sayısı)
        continue-on-error: true
        run: python3 scripts/check-bolum-paritesi.py

      # Birleştirilmiş sözlük ikizleri geri açılmasın · günlük hat terimi
      # yeniden yaratırsa 301 zinciri kırılır.
      - name: Birleştirilmiş terimler kontrolü
        run: python3 scripts/check-birlesmis-terimler.py

      # YENİ ikiz arar · guard yalnız yapılmış birleşmeleri koruyor. Bulursa
      # issue açar/günceller, hattı DÜŞÜRMEZ: birleştirme bir içerik kararı
      # (hangi slug kalacak) · günlük yayını bunun için durdurmak yanlış olur.
      - name: Yeni sözlük ikizi taraması
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ikiz-tara.py

      # Çok dilli her sayfa diğer dillerdeki sürümünü bildirmeli · normalize
      # edici yukarıda koştu, burada yalnız DOĞRULUYORUZ.
      - name: hreflang kontrolü
        run: python3 scripts/check-hreflang.py

      # Tazeleme yardımcı bir adım · GitHub API aksarsa asıl işi (içerik büyümesi
      # + commit) düşürmesin. 2026-08-02'de REST hız sınırı 403 döndü ve dört
      # çalışmayı üst üste düşürdü, o yüzden hem GraphQL'e geçildi hem bu bayrak.
      - name: Keşif sayfalarını tazele (tüm depolar · GraphQL toplu sorgu)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover-sync.py --refresh

      - name: Değişiklik varsa commit'le
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TreScout Bot"
            git config user.email "hello@trescout.com"
            git add -A
            git commit -m "chore(content-sync): rapordan yeni sözlük/keşif içeriği eklendi [skip ci]"
            git push
            echo "Yeni içerik eklendi ve push edildi."
          else
            echo "Eklenecek yeni içerik yok · güncel."
          fi

      - name: IndexNow ile arama motorlarına anında bildirim (Bing, Yandex)
        continue-on-error: true
        run: node scripts/indexnow.js

