name: Aylık zenginleştirme kuyruğu

# Oto-zenginleştirilemeyen (lite kalan) keşif entry'lerini ayda bir tek GitHub Issue'da toplar.
# İnsan döngüsü: ekip inceleyip en iyi seviyeye çeker. Secret gerekmez (Actions token'ı yeter).
on:
  schedule:
    - cron: '0 6 1 * *'   # her ayın 1'i 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kuyruğu derle + Issue aç/güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/enrichment-digest.py
