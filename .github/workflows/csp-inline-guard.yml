name: CSP Inline Guard

# Sayfa guard'ları · HTML değişen PR'larda + main push'larında (cron/app'in ürettiği rapor sayfaları dahil) çalışır.
# 1) Strict CSP (script-src/style-src 'self') varken inline CSS/JS sızmasın (bir kez kırılmıştı).
# 2) Nav tutarlılığı: shared-component (nav) sayfa tipine göre kaymasın — 'link kayboluyor' bug'ı tekrarlamasın.
# 3) Footer tutarlılığı: footer-grid'li tüm sayfalarda aynı "Ürün" linkleri (footer üreticiden üreticiye kaymasın).
# 4) Logo geometrisi: marka işaretinin şekli (3 yay + T) her yerde aynı (boyut/aria/çerçeve bağlama göre serbest).
# 5) Başlık tutarlılığı: keşif detay sayfasının H1'i katalogdaki headline ile aynı (alan bazlı taşımada sayfa geride kalmasın).
# 6) Marka tipografisi: 🚀 ve em dash (—) yayına giden sayfalarda geçmesin (kod blokları hariç).

# paths filtresi KALDIRILDI (2026-08-08). GitHub, bir PR'da 300'den fazla dosya
# değiştiğinde paths filtresini güvenilir uygulamıyor · üretilen sayfalara dokunan
# PR'lar (dil ekleme, arşiv basımı) tam da bu boyutta oluyor ve guard sessizce
# ATLANIYORDU. Sessizce atlanan guard, olmayan guard'dan daha kötü: yeşil görünür.
# Bedeli birkaç saniyelik koşu · guard 15 saniyede bitiyor.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapor snapshot helper testi
        run: node --test scripts/report-snapshot.test.js
      - name: Erken erişim API sözleşme testi
        run: node --test scripts/subscribe-contract.test.mjs
      - name: Telemetry consent ve queue sözleşme testi
        run: node --test scripts/telemetry-contract.test.mjs
      - name: Rapor sayfası script sözleşme testi
        run: node --test scripts/report-page-contract.test.mjs
      - name: Telemetry kapsam kontrolü
        run: python3 scripts/check-telemetry-coverage.py
      - name: Telemetry consent ve privacy disclosure kontrolü
        run: python3 scripts/check-telemetry-consent.py
      - name: Inline CSS/JS kontrolü
        run: python3 scripts/check-no-inline-csp.py
      - name: Nav tutarlılık kontrolü
        run: python3 scripts/check-nav-consistency.py
      - name: Footer tutarlılık kontrolü
        run: python3 scripts/check-footer-consistency.py
      - name: Logo geometri kontrolü
        run: python3 scripts/check-logo-consistency.py
      - name: Başlık tutarlılık kontrolü (katalog ↔ sayfa H1)
        run: python3 scripts/check-headline-consistency.py
      - name: Marka tipografi kontrolü (🚀 · em dash)
        run: python3 scripts/check-brand-typography.py

      # Aydınlatma/rıza · her kayıt formu SAYFANIN DİLİNDEKİ metne bağlanmalı.
      # 2026-08-06'da İngilizce sayfadan aydınlatma yapılmadan kayıt alındı.
      - name: Aydınlatma ve rıza kontrolü
        run: python3 scripts/check-consent-consistency.py

      # Elle bakılan sayfalar (ana sayfa · karşılaştırma) üç dilde aynı yapıyı
      # taşımalı · biri değişip diğerleri geride kalmasın.
      - name: Bölüm paritesi (üretilen sayfalar · h2 sayısı)
        run: python3 scripts/check-bolum-paritesi.py

      - name: Sayfa paritesi (diller arası yapı)
        run: python3 scripts/check-sayfa-paritesi.py

      # Birleştirilmiş sözlük ikizleri geri açılmasın · günlük hat terimi
      # yeniden yaratırsa 301 zinciri kırılır.
      - name: Birleştirilmiş terimler kontrolü
        run: python3 scripts/check-birlesmis-terimler.py

      # Çok dilli her sayfa diğer dillerdeki sürümünü bildirmeli ·
      # düzeltmesi: python3 scripts/hreflang-normalize.py
      - name: hreflang kontrolü
        run: python3 scripts/check-hreflang.py

      # Metadata, visible content ↔ JSON-LD doğruluğu, resmi AI crawler izinleri
      # ve erken erişim endpoint sözleşmesi. Guard yalnız dosya okur; ağ/e-posta
      # isteği göndermez.
      - name: SEO/GEO kontrolü
        run: python3 scripts/check-seo-geo.py
